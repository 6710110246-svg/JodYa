<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; }
.chat-container { max-width: 900px; margin: auto; height: 100vh; display: flex; flex-direction: column; background: white; }
.chat-header { padding: 12px 16px; border-bottom: 1px solid #ddd; font-weight: bold; display: flex; align-items: center; gap: 10px; background: white; z-index: 10; }
.back-btn { text-decoration: none; color: #0084ff; font-size: 20px; margin-right: 5px; }
.chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; background: #f0f2f5; }
.message-wrapper { display: flex; flex-direction: column; max-width: 70%; margin-bottom: 8px; }
.message { padding: 8px 12px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; }
.message img, .message video { max-width: 100%; border-radius: 10px; margin-top: 5px; display: block; }
.meta-info { font-size: 10px; margin-top: 2px; display: flex; align-items: center; gap: 4px; opacity: 0.7; }
.read-status { font-size: 10px; color: #0084ff; font-weight: bold; }
.wrapper-other { align-self: flex-start; }
.message-other { background: #e4e6eb; color: #000; border-bottom-left-radius: 4px; }
.meta-other { justify-content: flex-start; margin-left: 5px; }
.wrapper-me { align-self: flex-end; align-items: flex-end; }
.message-me { background: #0084ff; color: white; border-bottom-right-radius: 4px; }
.meta-me { justify-content: flex-end; margin-right: 5px; }
.chat-input { display: flex; padding: 10px; border-top: 1px solid #ddd; gap: 8px; background: #fff; align-items: center; }
.chat-input input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #ccc; outline: none; font-size: 14px; }
.btn-send { background: #0084ff; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }
.btn-upload { background: #e4e6eb; color: #606770; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.file-preview { display: none; padding: 10px; background: #f0f2f5; border-top: 1px solid #ddd; font-size: 12px; color: #666; }
</style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <a href="/chats" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <img src="{{ get_profile_image(other.username) }}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
        <span>{{ other.username }}</span>
    </div>
    <div class="chat-box" id="chat-box"></div>
    <div id="file-preview" class="file-preview">
        📎 <span id="filename"></span> <i class="fas fa-times" onclick="clearFile()" style="cursor:pointer; color:red;"></i>
    </div>
    <form id="chat-form" class="chat-input" enctype="multipart/form-data">
        <input type="file" id="file-input" name="file" accept="image/*,video/*" style="display: none;" onchange="showPreview()">
        <button type="button" class="btn-upload" onclick="document.getElementById('file-input').click()"><i class="fas fa-image"></i></button>
        <input id="message-input" name="message" placeholder="พิมพ์ข้อความ..." autocomplete="off">
        <button type="submit" class="btn-send"><i class="fas fa-paper-plane"></i></button>
    </form>
</div>
<script>
const form = document.getElementById("chat-form");
const msgInput = document.getElementById("message-input");
const fileInput = document.getElementById("file-input");
const box = document.getElementById("chat-box");
const currentUserId = {{ current_user.id }};

function showPreview() {
    const file = fileInput.files[0];
    if (file) {
        document.getElementById('file-preview').style.display = 'block';
        document.getElementById('filename').innerText = file.name;
    }
}
function clearFile() {
    fileInput.value = "";
    document.getElementById('file-preview').style.display = 'none';
}

form.addEventListener("submit", function(e) {
    e.preventDefault();
    const formData = new FormData(form);
    if (!msgInput.value.trim() && !fileInput.files.length) return;

    fetch(window.location.pathname, { method: "POST", body: formData })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            msgInput.value = "";
            clearFile();
            loadMessages(); 
        }
    });
});

function loadMessages() {
    fetch("/chat_messages/{{ other.username }}")
        .then(res => res.json())
        .then(data => {
            let shouldScroll = false;
            const isAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 100;

            data.forEach(msg => {
                const msgDomId = `msg-${msg.id}`;
                let existingMsg = document.getElementById(msgDomId);
                const isMe = msg.sender_id === currentUserId;
                const readText = msg.is_read ? "อ่านแล้ว" : "ส่งแล้ว";
                
                if (existingMsg) {
                    if (isMe) {
                        const statusSpan = existingMsg.querySelector('.read-status');
                        if (statusSpan && statusSpan.innerText !== readText) {
                            statusSpan.innerText = readText;
                            if (msg.is_read) statusSpan.style.color = "#0084ff";
                        }
                    }
                } else {
                    shouldScroll = true;
                    const wrapperClass = isMe ? "wrapper-me" : "wrapper-other";
                    const bubbleClass = isMe ? "message-me" : "message-other";
                    const metaClass = isMe ? "meta-me" : "meta-other";
                    let readStatusHtml = isMe ? `<span class="read-status" style="${msg.is_read ? 'color:#0084ff;' : ''}">${readText}</span>` : "";
                    
                    let mediaHtml = "";
                    if (msg.media_type === 'image') mediaHtml = `<img src="/static/${msg.media_path}" onclick="window.open(this.src)">`;
                    else if (msg.media_type === 'video') mediaHtml = `<video controls playsinline src="/static/${msg.media_path}"></video>`;
                    
                    let textHtml = msg.content ? `<div>${msg.content}</div>` : "";

                    const div = document.createElement('div');
                    div.id = msgDomId;
                    div.className = `message-wrapper ${wrapperClass}`;
                    div.innerHTML = `<div class="message ${bubbleClass}">${textHtml}${mediaHtml}</div><div class="meta-info ${metaClass}"><span>${msg.time}</span>${readStatusHtml}</div>`;
                    box.appendChild(div);
                }
            });
            if (shouldScroll && isAtBottom) box.scrollTop = box.scrollHeight;
        });
}
loadMessages();
setInterval(loadMessages, 2000);
</script>
</body>
</html>
